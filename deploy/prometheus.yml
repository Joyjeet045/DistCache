global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: distcache
    metrics_path: /metrics
    static_configs:
      - targets:
          - cache-1:9121
          - cache-2:9121
          - cache-3:9121
        labels:
          cluster: distcache
    relabel_configs:
      # Use the container hostname (cache-1/2/3) as the instance label.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
